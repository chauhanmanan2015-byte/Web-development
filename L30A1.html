<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            font-family: Arial;
            bckground: #f0f4ff;
            padding: 30px;
            text-align: center;

        }
    </style>

</head>

<body>
    <h1>My Planet Cards</h1>
    <p>Use a JavaScript class to build the planet cards.</p>
    <button onclick="showPlanet()">Show Planet</button>
    <div class="cards">
        <div id="card1"></div>
        <div id="card2"></div>
        <div id="card3"></div>
    </div>

    <script>

        class Planet {
            constructor(name, fact) {

                this.name = name;
                this.fact = fact;
            }

            describe() {
                return this.name + ": " + this.fact;

            }

        }

        function showPlanets() {
            let p1 = new Planet("Earth", "the only planet known to support life.");

            let p2 = new Planet("Mars", "the red planet.");
            let p3 = new Planet("Jupiter", "the largest planet in our solar system.");


            document.getElementById("card1").innerHTML =
                "<div class='card'><div class='planet-name'>" + p1.name + "</div>" +
                "<div class='planet-fact'>" + p1.describe() + '</div></div>'

            document.getElementById("card2").innerHTML =
                "<div class='card'><div class='planet-name'>" + p2.name + "</div>" +
                "<div class='planet-fact'>" + p2.describe() + '</div></div>'

            document.getElementById("card3").innerHTML =
                "<div class='card'><div class='planet-name'>" + p3.name + "</div>" +
                "<div class='planet-fact'>" + p3.describe() + '</div></div>'
        }

    </script>
</body>

</html>
