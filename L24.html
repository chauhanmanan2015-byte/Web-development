<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Functions</h1>
    <button onclick="display(4,5)">Click me</button>
    <script>
        function display(x, y) {
            if (y == undefined) {
                y = 10;
            }
            document.write(x * y);

        }


    </script>


</body>

</html>
