<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">


    <style>
        body {

            background-color: #f9f9f9;

            font-family: Arial, sans-serif;

            padding: 30px 15px;

        }

        h1 {

            text-align: center;

            color: #FF5A43;

        }

        .hobby-card {

            text-align: center;

            border: 2px solid #FF5A43;

            border-radius: 8px;

            padding: 20px;

            margin-bottom: 20px;

            background-color: #fff8e1;

        }

        .hobby-card h3 {

            color: #FF5A43;

        }
    </style>
</head>

<body>
    <h3>Equal width columns grid.</h3>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Drawing</h3>
                    <p>I love drawing the animals.</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Football</h3>
                    <p>I love playing football and i play with my friends.</p>
                </div>
            </div>



            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Reading</h3>
                    <p>I love reading and it helps me know the stories.</p>
                </div>
            </div>

        </div>
    </div>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

    </script>

</body>

</html>
