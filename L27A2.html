<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Methods in Arrays</h1>

    <p id="Fruits"></p>
    <p id="Vegetables"></p>

    <script>

        var arr = ['Mango', 'Pineapple', 'Banana', 'Apple', 'Orange'];
        document.getElementById("Fruits").innerHTML = arr.join("|");

        var arr2 = ['Potato', 'Tomato', 'Onion', 'Carrot', 'Cabbage'];
        arr2.pop();
        document.getElementById("Vegetables").innerHTML = arr2;

    </script>


</body>

</html>
