<!DOCTYPE html>
<html>

<head>
    <title>Simple Calculator</title>
</head>

<body>

    <h1>Simple Calculator</h1>
    <p>Perform all operations using JavaScript</p>
    <p id="add"></p>
    <p id="sub"></p>
    <p id="mul"></p>
    <p id="div"></p>

    <script>
        // Addition
        var a = 10;
        var b = 5;
        var sum = a + b;
        document.getElementById("add").innerHTML = "Addition: " + sum;

        // Subtraction
        var difference = a - b;
        document.getElementById("sub").innerHTML = "Subtraction: " + difference;

        // Multiplication
        var product = a * b;
        document.getElementById("mul").innerHTML = "Multiplication: " + product;

        // Division
        var quotient = a / b;
        document.getElementById("div").innerHTML = "Division: " + quotient;



</body >



</html >
